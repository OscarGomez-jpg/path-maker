<!DOCTYPE html>
<html>
<head>
    <title>Path-Maker Mobile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; overflow: hidden; display: flex; align-items: center; justify-content: center; width: 100vw; height: 100vh; }
        #container { position: absolute; width: 100%; height: 100%; top: 0; left: 0; display: none; }
        video { width: 100%; height: 100%; object-fit: cover; }
        #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #status { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 5px 12px; border-radius: 20px; font-size: 14px; z-index: 100; border: 1px solid #444; }
        #start-btn { padding: 25px 50px; font-size: 24px; background: #00ff00; color: black; border: none; border-radius: 50px; cursor: pointer; z-index: 200; font-weight: bold; box-shadow: 0 0 20px rgba(0,255,0,0.3); }
    </style>
</head>
<body>
    <button id="start-btn">START CAMERA</button>

    <div id="container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div id="status">Connecting...</div>
    </div>

    <script>
        const socket = io();
        const startBtn = document.getElementById('start-btn');
        const container = document.getElementById('container');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');

        if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
            alert("HTTPS Required for camera.");
            window.location.href = "https://" + location.host;
        }

        startBtn.onclick = () => {
            startBtn.style.display = 'none';
            container.style.display = 'block';
            
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }, 
                audio: false 
            })
            .then(stream => {
                video.srcObject = stream;
                status.innerText = "Streaming Active";
                
                // Ajustar resolución del canvas de dibujo al tamaño de pantalla real
                const resize = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                };
                window.onresize = resize;
                resize();
                
                sendFrame();
            })
            .catch(err => {
                status.innerText = "Camera Error: " + err.name;
            });
        };

        const hiddenCanvas = document.createElement('canvas');
        const hCtx = hiddenCanvas.getContext('2d');

        const sendFrame = () => {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                // Enviamos a 320x240 para velocidad de IA
                hiddenCanvas.width = 320;
                hiddenCanvas.height = 240;
                hCtx.drawImage(video, 0, 0, 320, 240);
                const data = hiddenCanvas.toDataURL('image/jpeg', 0.4);
                socket.emit('image', data);
            }
            setTimeout(sendFrame, 100); // 5 FPS (200ms)
        };

        socket.on('response', (data) => {
            // Limpiar canvas antes de dibujar nuevos puntos
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. Dibujar Objetos y Suelo
            data.points.forEach(obj => {
                if (obj.points.length < 2) return;
                
                ctx.beginPath();
                // Usar el color enviado por el servidor o uno dinámico
                if (obj.type === 'floor') {
                    ctx.strokeStyle = "rgba(0, 255, 0, 0.5)"; // Verde para el suelo
                    ctx.lineWidth = 2;
                } else {
                    ctx.strokeStyle = "rgba(255, 0, 0, 0.8)"; // Rojo para obstáculos
                    ctx.lineWidth = 3;
                }
                
                obj.points.forEach((p, idx) => {
                    const x = (p[0] / 320) * canvas.width;
                    const y = (p[1] / 240) * canvas.height;
                    if (idx === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });
                ctx.stroke();
            });

            // 2. DIBUJAR CAMINO (PATH)
            if (data.path && data.path.length > 1) {
                ctx.beginPath();
                ctx.strokeStyle = "#00ffff"; // Cyan brillante para el camino
                ctx.lineWidth = 8;
                ctx.lineCap = "round";
                ctx.lineJoin = "round";
                
                data.path.forEach((p, idx) => {
                    const x = (p[0] / 320) * canvas.width;
                    const y = (p[1] / 240) * canvas.height;
                    if (idx === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                    
                    // Dibujar nodos del camino
                    ctx.fillStyle = "white";
                    ctx.beginPath();
                    ctx.arc(x, y, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.moveTo(x, y); // Volver al punto para continuar la línea
                });
                ctx.stroke();
            }
        });

        socket.on('connect', () => status.innerText = "Server Connected");
        socket.on('disconnect', () => status.innerText = "Server Disconnected");
    </script>
</body>
</html>
