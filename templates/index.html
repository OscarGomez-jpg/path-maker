<!DOCTYPE html>
<html>
<head>
    <title>Path-Maker Mobile AR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Load Socket.IO for real-time communication -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        /* Mobile-first full-screen layout */
        body { margin: 0; background: #000; color: white; font-family: sans-serif; overflow: hidden; display: flex; align-items: center; justify-content: center; width: 100vw; height: 100vh; }
        #container { position: absolute; width: 100%; height: 100%; top: 0; left: 0; display: none; }
        
        /* Video feeds the camera background */
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Canvas draws the AR overlay (path and objects) */
        #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        #status { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 5px 12px; border-radius: 20px; font-size: 14px; z-index: 100; border: 1px solid #444; }
        
        /* Modern call-to-action button for user activation */
        #start-btn { padding: 25px 50px; font-size: 24px; background: #00ff00; color: black; border: none; border-radius: 50px; cursor: pointer; z-index: 200; font-weight: bold; box-shadow: 0 0 20px rgba(0,255,0,0.3); }
    </style>
</head>
<body>
    <button id="start-btn">START NAVIGATOR</button>

    <div id="container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div id="status">Connecting...</div>
    </div>

    <script>
        /**
         * Path-Maker Mobile AR Client.
         * Handles camera access, frame transmission, and path rendering.
         */
        const socket = io();
        const startBtn = document.getElementById('start-btn');
        const container = document.getElementById('container');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');

        // Enforcement of Secure Context (Required by browser for camera access)
        if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
            alert("HTTPS is mandatory for camera access over local network.");
            window.location.href = "https://" + location.host;
        }

        /**
         * Initializes camera and UI after user interaction.
         */
        startBtn.onclick = () => {
            startBtn.style.display = 'none';
            container.style.display = 'block';
            
            // Request camera stream (environment/back camera)
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }, 
                audio: false 
            })
            .then(stream => {
                video.srcObject = stream;
                status.innerText = "System Active";
                
                // Handle responsive canvas resizing
                const resize = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                };
                window.onresize = resize;
                resize();
                
                startTransmission();
            })
            .catch(err => {
                status.innerText = "Camera Permission Denied: " + err.name;
            });
        };

        const hiddenCanvas = document.createElement('canvas');
        const hCtx = hiddenCanvas.getContext('2d');

        /**
         * Sends camera frames to the server at a controlled frame rate (5 FPS).
         */
        const startTransmission = () => {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                // Resize frame to 320x240 for server-side AI efficiency
                hiddenCanvas.width = 320;
                hiddenCanvas.height = 240;
                hCtx.drawImage(video, 0, 0, 320, 240);
                const data = hiddenCanvas.toDataURL('image/jpeg', 0.4);
                socket.emit('image', data);
            }
            // Loop with 200ms delay (5 FPS)
            setTimeout(startTransmission, 200); 
        };

        /**
         * Processes server response and renders AR elements.
         */
        socket.on('response', (data) => {
            // Clear overlay before redraw
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. RENDER DETECTED OBJECTS AND FLOOR
            data.points.forEach(obj => {
                if (obj.points.length < 2) return;
                
                ctx.beginPath();
                if (obj.type === 'floor') {
                    ctx.strokeStyle = "rgba(0, 255, 0, 0.4)"; // Soft green for floor
                    ctx.lineWidth = 2;
                } else {
                    ctx.strokeStyle = "rgba(255, 0, 0, 0.7)"; // Bright red for obstacles
                    ctx.lineWidth = 3;
                }
                
                obj.points.forEach((p, idx) => {
                    // Map 320x240 processing coordinates to full screen pixels
                    const x = (p[0] / 320) * canvas.width;
                    const y = (p[1] / 240) * canvas.height;
                    if (idx === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });
                ctx.stroke();
            });

            // 2. RENDER NAVIGATION PATH
            if (data.path && data.path.length > 1) {
                ctx.beginPath();
                ctx.strokeStyle = "#00ffff"; // High-visibility Cyan path
                ctx.lineWidth = 10;
                ctx.lineCap = "round";
                ctx.lineJoin = "round";
                
                data.path.forEach((p, idx) => {
                    const x = (p[0] / 320) * canvas.width;
                    const y = (p[1] / 240) * canvas.height;
                    if (idx === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                    
                    // Draw path node (white circle)
                    ctx.fillStyle = "white";
                    ctx.beginPath();
                    ctx.arc(x, y, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.moveTo(x, y); 
                });
                ctx.stroke();
            }
        });

        // Connection Status Event Handlers
        socket.on('connect', () => status.innerText = "Server Connected");
        socket.on('disconnect', () => status.innerText = "Connection Lost");
    </script>
</body>
</html>
